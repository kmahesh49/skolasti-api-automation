name: Skolasti API Test Automation

on:
  # Schedule: Run every day at 6:00 AM IST (12:30 AM UTC)
  schedule:
    - cron: '30 0 * * *'  # Adjust timezone as needed
  
  # Manual trigger
  workflow_dispatch:
  
  # Trigger on push to main/develop
  push:
    branches: [ main, develop ]
  
  # Trigger on pull request to main
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev
      
      - name: Run API tests
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          COURSE_API_BASE_URL: ${{ secrets.COURSE_API_BASE_URL }}
        run: npm test
        continue-on-error: true
      
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No test results found, skipping Allure report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No test results available</h1></body></html>" > allure-report/index.html
          fi
      
      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
            allure-results/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Skolasti API Test Report - ${{ job.status }} - Run #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Test execution completed with status: ${{ job.status }}
            
            Run Number: ${{ github.run_number }}
            Triggered by: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            View detailed report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Download artifacts to view the complete test report.
          convert_markdown: true
