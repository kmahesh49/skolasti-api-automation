name: Skolasti API Test Automation

on:
  # Schedule: Run every day at 6:00 AM IST (12:30 AM UTC)
  schedule:
    - cron: '30 0 * * *'  # Adjust timezone as needed
  
  # Manual trigger
  workflow_dispatch:
  
  # Trigger on push to main/develop
  push:
    branches: [ main, develop ]
  
  # Trigger on pull request to main
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev
      
      - name: Run API tests
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          COURSE_API_BASE_URL: ${{ secrets.COURSE_API_BASE_URL }}
        run: npm test
        continue-on-error: true
      
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No test results found, skipping Allure report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No test results available</h1></body></html>" > allure-report/index.html
          fi
      
      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
            allure-results/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: reports/run-${{ github.run_number }}
          keep_files: true
      
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          connection_url: smtp://${{ secrets.MAIL_USERNAME }}:${{ secrets.MAIL_PASSWORD }}@smtp.gmail.com:587
          subject: Skolasti API Test Report - Run ${{ github.run_number }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: |
            <h2>✅ Skolasti API Test Automation Report</h2>
            
            <p><strong>Run Number:</strong> ${{ github.run_number }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered by:</strong> ${{ github.event_name }}</p>
            <p><strong>Timestamp:</strong> ${{ github.event.head_commit.timestamp }}</p>
            
            <hr>
            
            <h3>📊 View Test Reports:</h3>
            <ul>
              <li><a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/run-${{ github.run_number }}/">📈 Allure Report (Detailed)</a></li>
              <li><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔍 GitHub Actions Run</a></li>
            </ul>
            
            <p><strong>Note:</strong> Allure report will be available in 2-3 minutes after deployment.</p>
            
            <hr>
            <p style="font-size: 12px; color: #666;">
              Download artifacts: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Click here</a>
            </p>
